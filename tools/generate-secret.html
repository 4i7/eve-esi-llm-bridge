<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline MCP_AUTH_SECRET generator</title>
<style>
body{font:16px system-ui,sans-serif;max-width:760px;margin:48px auto;padding:0 20px;line-height:1.5}button{font:inherit;padding:.7rem 1rem}code{display:block;word-break:break-all;background:#f3f3f3;padding:1rem;margin:1rem 0}small{color:#555}
</style>
<h1>Offline MCP_AUTH_SECRET generator</h1>
<p>This page uses your browser's Web Crypto API. It does not send the generated value anywhere.</p>
<button id="g">Generate 32-byte secret</button>
<code id="o">Click Generate.</code>
<button id="c" disabled>Copy</button>
<p><small>Use the value as <code style="display:inline;padding:.1rem .3rem">MCP_AUTH_SECRET</code> in your own Vercel project. Never commit it.</small></p>
<script>
const out=document.querySelector('#o'), copy=document.querySelector('#c');
function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'')}
document.querySelector('#g').onclick=()=>{const b=new Uint8Array(32);crypto.getRandomValues(b);out.textContent=b64u(b);copy.disabled=false};
copy.onclick=async()=>navigator.clipboard.writeText(out.textContent);
</script>
</html>
